
name: Daily Follower Growth

on:
  schedule:
    # Every day at 8:15 PM Oman time
    - cron: "15 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-follower-growth
  cancel-in-progress: false

jobs:
  growth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover developers and monitor followers
        env:
          FOLLOWING_TOKEN5: ${{ secrets.FOLLOWING_TOKEN5 }}
        run: python attract_followers.py

      - name: Save reports
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"

          git add follower_state.json
          git add follower_growth.json
          git add candidate_developers.json

          git diff --cached --quiet || git commit -m "Update daily follower growth"

          git push
