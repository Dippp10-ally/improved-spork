
name: Follow Approved GitHub Users

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-user-following
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Follow approved users
        env:
          FOLLOW_TOKEN: ${{ secrets.FOLLOW_TOKEN }}
        run: python follow_users.py

      - name: Track following list
        env:
          FOLLOW_TOKEN: ${{ secrets.FOLLOW_TOKEN }}
        run: python track_followers.py

      - name: Save reports
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"

          git add follow_results.json
          git add following_history.json
          git add following_report.md

          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Update daily following report"
            git push
          fi
