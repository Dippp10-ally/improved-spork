
name: Integrated Follower Growth

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrated-follower-growth
  cancel-in-progress: false

jobs:
  follower-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved files
        run: |
          count=0

          for i in $(seq 1 13); do
            file="approved_users_part_${i}.txt"

            if [ -f "$file" ]; then
              echo "$file exists"
              count=$((count + 1))
            fi
          done

          echo "Found $count approved files."

          if [ "$count" -eq 0 ]; then
            echo "No approved files found."
            exit 1
          fi

      - name: Discover potential developers
        env:
          FOLLOWING_TOKEN5: ${{ secrets.FOLLOWING_TOKEN5 }}
        run: python attract_followers.py

      - name: Review and process approved users
        env:
          FOLLOW_TOKEN: ${{ secrets.FOLLOW_TOKEN }}
        run: python follow_users.py

      - name: Update incoming follower report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python track_followers.py

      - name: Check report sizes
        run: |
          for file in \
            follow_results.json \
            follow_state.json \
            users_to_review.txt \
            potential_followers.json \
            potential_followers.txt \
            follower_history.json \
            follower_report.md
          do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              echo "$file: $size bytes"

              if [ "$size" -gt 90000000 ]; then
                echo "Report too large: $file"
                exit 1
              fi
            fi
          done

      - name: Commit reports and follow state
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"

          for file in \
            follow_results.json \
            follow_state.json \
            users_to_review.txt \
            potential_followers.json \
            potential_followers.txt \
            follower_history.json \
            follower_report.md
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "chore: update follower reports"
            git push origin HEAD:main
          else
            echo "No report changes."
          fi
