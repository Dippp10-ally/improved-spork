
name: Follow Approved Users

on:
  schedule:
    # Daily at 8:15 PM Oman time (UTC+4)
    - cron: "15 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follow-approved-users
  cancel-in-progress: false

jobs:
  follow-users:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run approved following script
        env:
          FOLLOW_TOKEN: ${{ secrets.FOLLOW_TOKEN }}
        run: |
          python follow_approved_users.py

      - name: Track following list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python track_followers.py

      - name: Commit progress and reports
        if: always()
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"

          for file in \
            approved_following_progress.json \
            follow_report.md \
            following_progress.json \
            following_history.json \
            following_report.md
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No report or progress changes to commit."
          else
            git commit -m "Update following progress and reports"
            git push origin HEAD:main
          fi
