name: Repositories 1-20

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task catalog
        uses: actions/checkout@v4

      - name: Create, Star, and Process Repositories
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Your exact repository JSON data payload
          JSON_DATA='{
            "repositories": [
              {
                "repo": "repo n1",
                "task": "Add input validation for empty values",
                "commit": "fix: add empty value validation"
              },
              {
                "repo": "repo n2",
                "task": "Add unit tests for boundary conditions",
                "commit": "test: add boundary condition coverage"
              },
              {
                "repo": "repo n3",
                "task": "Improve error handling for invalid input",
                "commit": "fix: improve invalid input handling"
              },
              {
                "repo": "repo n4",
                "task": "Update README with installation instructions",
                "commit": "docs: update installation instructions"
              },
              {
                "repo": "repo n5",
                "task": "Add tests for empty collections",
                "commit": "test: cover empty collections"
              },
              {
                "repo": "repo n6",
                "task": "Handle missing configuration values",
                "commit": "fix: handle missing configuration values"
              },
              {
                "repo": "repo n7",
                "task": "Add validation for numeric input",
                "commit": "feat: validate numeric input"
              },
              {
                "repo": "repo n8",
                "task": "Improve malformed data handling",
                "commit": "fix: improve malformed data handling"
              },
              {
                "repo": "repo n9",
                "task": "Add regression tests for existing behavior",
                "commit": "test: add regression coverage"
              },
              {
                "repo": "repo n10",
                "task": "Document command usage examples",
                "commit": "docs: add command usage examples"
              },
              {
                "repo": "repo n11",
                "task": "Add validation for required fields",
                "commit": "feat: validate required fields"
              },
              {
                "repo": "repo n12",
                "task": "Handle unavailable files gracefully",
                "commit": "fix: handle unavailable files"
              },
              {
                "repo": "repo n13",
                "task": "Add tests for null values",
                "commit": "test: cover null values"
              },
              {
                "repo": "repo n14",
                "task": "Improve command error messages",
                "commit": "fix: improve command error messages"
              }
            ]
          }'

          echo "$JSON_DATA" | jq -c '.repositories[0:20][]' | while IFS= read -r item; do
            raw_repo=$(jq -r '.repo' <<< "$item")
            task=$(jq -r '.task' <<< "$item")
            commit_message=$(jq -r '.commit' <<< "$item")

            # Convert spaces to hyphens for valid GitHub naming URLs
            repo="${raw_repo// /-}"

            echo "======================================"
            echo "Processing: $OWNER/$repo"
            echo "Task: $task"
            echo "======================================"

            # 1. Check & Create repository if missing
            if ! gh repo view "$OWNER/$repo" >/dev/null 2>&1; then
              echo "Repository $OWNER/$repo does not exist. Creating public repository..."
              gh repo create "$OWNER/$repo" --public --include-all-branches false
            fi

            # 2. Star the repository
            echo "Starring repository $OWNER/$repo..."
            gh repo star "$OWNER/$repo" || echo "Note: Already starred or failed to star."

            rm -rf target

            # 3. Clone and apply maintenance scripts
            git clone \
              "https://x-access-token:${GH_TOKEN}@://github.com{OWNER}/${repo}.git" \
              target

            pushd target > /dev/null

            if [ ! -x scripts/maintenance.sh ]; then
              echo "No executable scripts/maintenance.sh; skipping tasks."
              popd > /dev/null
              rm -rf target
              continue
            fi

            TASK="$task" ./scripts/maintenance.sh

            if [ -x scripts/test.sh ]; then
              echo "Running tests..."
              ./scripts/test.sh
            fi

            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "Dippp10-ally"
              git config user.email "dipikabarkat@gmail.com"

              git add -A
              git commit -m "$commit_message"
              git push origin HEAD
              echo "Changes committed and pushed."
            else
              echo "No changes produced by task."
            fi

            popd > /dev/null
            rm -rf target

          done
