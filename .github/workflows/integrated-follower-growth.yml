
name: Integrated Follower Growth

on:
  schedule:
    - cron: "15 16 * * *" # 8:15 PM Oman time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follower-growth
  cancel-in-progress: false

jobs:
  follower-growth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover potential developers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python attract_followers.py

      - name: Check 13 approved user files
        run: |
          total=0

          for i in $(seq 1 13); do
            file="approved_users_part_${i}.txt"

            if [ -f "$file" ]; then
              count=$(grep -cve '^[[:space:]]*$' "$file" || true)
              echo "$file: $count usernames"
              total=$((total + count))
            else
              echo "Missing file: $file"
            fi
          done

          echo "Total approved usernames: $total"

          if [ "$total" -eq 0 ]; then
            echo "No approved usernames found."
            exit 1
          fi

      - name: Process approved users
        env:
          FOLLOWING_TOKEN5: ${{ secrets.FOLLOWING_TOKEN5 }}
        run: |
          if [ -n "$FOLLOWING_TOKEN5" ]; then
            python follow_users.py
          else
            echo "FOLLOWING_TOKEN5 is not configured."
            echo "Following step skipped; discovery and tracking can continue."
          fi

      - name: Track actual incoming followers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          username = "Dippp10-ally"
          token = os.getenv("GITHUB_TOKEN")

          url = f"https://api.github.com/users/{username}/followers?per_page=100"
          followers = []
          page = 1

          while True:
              request = urllib.request.Request(
                  f"{url}&page={page}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      **({"Authorization": f"Bearer {token}"} if token else {})
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              if not data:
                  break

              followers.extend(user["login"] for user in data)
              page += 1

          history_file = Path("follower_history.json")

          if history_file.exists():
              history = json.loads(history_file.read_text())
          else:
              history = []

          history.append({
              "date": datetime.now(timezone.utc).isoformat(),
              "follower_count": len(followers),
              "followers": sorted(set(followers))
          })

          history_file.write_text(json.dumps(history, indent=2))

          report = [
              "# GitHub Follower Report",
              "",
              f"- Account: {username}",
              f"- Current followers: {len(set(followers))}",
              f"- Report date: {datetime.now(timezone.utc).isoformat()}",
              "",
              "## Current followers",
              ""
          ]

          report.extend(f"- {name}" for name in sorted(set(followers)))

          Path("follower_report.md").write_text("\n".join(report) + "\n")

          print(f"Current incoming followers: {len(set(followers))}")
          PY

      - name: Commit daily results
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"

          for file in \
            potential_followers.json \
            potential_followers.txt \
            follow_results.json \
            follower_history.json \
            follower_report.md
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily follower report"
            git push origin HEAD
          else
            echo "No changes to commit."
          fi
