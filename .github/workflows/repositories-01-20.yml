name: Repositories 1-20

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task catalog
        uses: actions/checkout@v4

      - name: Process repositories 1-20
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          jq -c '.repositories[0:20][]' repository-tasks.json |
          while IFS= read -r item; do

            raw_repo=$(jq -r '.repo' <<< "$item")
            task=$(jq -r '.task' <<< "$item")
            commit_message=$(jq -r '.commit' <<< "$item")

            # Clean spaces into hyphens for valid GitHub slugs (e.g. "repo n1" -> "repo-n1")
            repo="${raw_repo// /-}"

            echo "======================================"
            echo "Repository: $OWNER/$repo"
            echo "Task: $task"
            echo "======================================"

            # 1. Create the repository if it does not exist yet
            if ! gh repo view "$OWNER/$repo" >/dev/null 2>&1; then
              echo "Repository $OWNER/$repo does not exist. Creating public repository..."
              gh repo create "$repo" --public --include-all-branches=false
              echo "Repository created successfully."
            fi

            # 2. Star the repository using the GitHub API
            echo "Starring repository $OWNER/$repo..."
            gh api -X PUT "/user/starred/$OWNER/$repo" || echo "Already starred or unable to star."

            rm -rf target

            # 3. Handle cloning or local initialization
            # Fixed the variable expansion format in the URL string
            if git clone "https://x-access-token:${GH_TOKEN}@://github.com{OWNER}/${repo}.git" target 2>/dev/null; then
              echo "Successfully cloned existing repository."
              cd target
            else
              echo "Repository appears to be empty. Initializing locally..."
              mkdir target
              cd target
              git init -b main
              git remote add origin "https://x-access-token:${GH_TOKEN}@://github.com{OWNER}/${repo}.git"
            fi

            # 4. Create/update the maintenance record
            {
              echo "# Maintenance"
              echo
              echo "## Current task"
              echo
              echo "$task"
              echo
              echo "## Updated"
              echo
              echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            } > MAINTENANCE.md

            # Basic repository validation
            git status --short

            # Commit and push updates
            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "Dippp10-ally"
              git config user.email "dipikabarkat@gmail.com"

              git add MAINTENANCE.md
              git commit -m "$commit_message"
              
              # Force a tracking relationship setup if this is the first push on a new main branch
              git push -u origin HEAD

              echo "Changes pushed to $OWNER/$repo"
            else
              echo "No changes required."
            fi

            cd ..
            rm -rf target

          done
