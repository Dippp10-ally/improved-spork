name: Repositories 1-20

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task catalog
        uses: actions/checkout@v4

      - name: Create, Star, and Process Repositories
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ ! -f repository-tasks.json ]; then
            echo "::error::repository-tasks.json not found in workspace root!"
            exit 1
          fi

          jq -c '.repositories[0:20][]' repository-tasks.json | while IFS= read -r item; do
            raw_repo=$(jq -r '.repo' <<< "$item")
            task=$(jq -r '.task' <<< "$item")
            commit_message=$(jq -r '.commit' <<< "$item")

            # Convert spaces to hyphens (e.g. "repo n1" -> "repo-n1")
            repo="${raw_repo// /-}"

            echo "======================================"
            echo "Processing: $OWNER/$repo"
            echo "Task: $task"
            echo "======================================"

            # 1. Check and create repository if it does not exist
            if ! gh repo view "$OWNER/$repo" >/dev/null 2>&1; then
              echo "Repository $OWNER/$repo does not exist. Creating public repository..."
              
              # Fixed gh syntax: pass the short name and use explicit public flag
              gh repo create "$repo" --public --include-all-branches=false
              
              echo "Repository created successfully."
            fi

            # 2. Star the repository
            echo "Starring repository $OWNER/$repo..."
            gh repo star "$OWNER/$repo" || echo "Note: Already starred or unable to star."

            rm -rf target

            # 3. Clone and apply maintenance scripts
            git clone \
              "https://x-access-token:${GH_TOKEN}@://github.com{OWNER}/${repo}.git" \
              target

            pushd target > /dev/null

            if [ ! -x scripts/maintenance.sh ]; then
              echo "No executable scripts/maintenance.sh; skipping."
              popd > /dev/null
              rm -rf target
              continue
            fi

            TASK="$task" ./scripts/maintenance.sh

            if [ -x scripts/test.sh ]; then
              echo "Running tests..."
              ./scripts/test.sh
            fi

            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "Dippp10-ally"
              git config user.email "dipikabarkat@gmail.com"

              git add -A
              git commit -m "$commit_message"
              git push origin HEAD
              echo "Changes committed and pushed."
            else
              echo "No changes produced by task."
            fi

            popd > /dev/null
            rm -rf target

          done
