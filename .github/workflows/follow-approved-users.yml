
name: Follow Approved GitHub Users

on:
  schedule:
    # Daily at 8:15 PM Oman time (UTC 16:15)
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run follow script
        env:
          FOLLOW_TOKEN: ${{ secrets.FOLLOW_TOKEN }}
        run: python follow_users.py

      - name: Save results
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"
          git add follow_results.json
          git diff --cached --quiet || git commit -m "Update follow results"
          git push
