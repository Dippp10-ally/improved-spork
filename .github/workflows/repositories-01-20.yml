name: Repositories 1-20

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task catalog
        uses: actions/checkout@v4

      - name: Process repositories 1-20
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          jq -c '.repositories[0:20][]' repository-tasks.json |
          while IFS= read -r item; do

            repo=$(jq -r '.repo' <<< "$item")
            task=$(jq -r '.task' <<< "$item")
            commit_message=$(jq -r '.commit' <<< "$item")

            echo "======================================"
            echo "Processing: $OWNER/$repo"
            echo "Task: $task"
            echo "======================================"

            # GITHUB_TOKEN cannot create new repositories.
            # Therefore the repository must already exist.
            if ! gh repo view "$OWNER/$repo" >/dev/null 2>&1; then
              echo "::warning::Repository $OWNER/$repo does not exist."
              echo "Skipping because GITHUB_TOKEN cannot create repositories."
              continue
            fi

            rm -rf target

            # Clone using the workflow's built-in GitHub token.
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${repo}.git" \
              target

            cd target

            # Repository-specific maintenance script.
            if [ ! -x scripts/maintenance.sh ]; then
              echo "No executable scripts/maintenance.sh; skipping."
              cd ..
              rm -rf target
              continue
            fi

            TASK="$task" ./scripts/maintenance.sh

            # Run repository tests when available.
            if [ -x scripts/test.sh ]; then
              echo "Running tests..."
              ./scripts/test.sh
            fi

            # Commit only if the task actually changed something.
            if [ -n "$(git status --porcelain)" ]; then

              git config user.name "Dippp10-ally"
              git config user.email "dipikabarkat@gmail.com"

              git add -A

              git commit \
                -m "$commit_message"

              git push origin HEAD

              echo "Changes committed and pushed."
            else
              echo "No changes produced by task."
            fi

            cd ..
            rm -rf target

          done
