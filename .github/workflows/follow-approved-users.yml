
name: Follow Approved Users

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follow-approved-users
  cancel-in-progress: false

jobs:
  follow-users:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check progress file
        run: |
          if [ ! -f following_progress.json ]; then
            echo '{"next_page":1,"users":[],"scan_started":null}' > following_progress.json
          fi

      - name: Run following tracker
        env:
          FOLLOW_TOKEN: ${{ secrets.FOLLOW_TOKEN }}
        run: |
          python track_followers.py

      - name: Commit progress and reports
        run: |
          git config user.name "Dippp10-ally"
          git config user.email "dipikabarkat@gmail.com"

          git add following_progress.json
          git add following_history.json
          git add following_report.md

          if ! git diff --cached --quiet; then
            git commit -m "Continue following list pagination"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
